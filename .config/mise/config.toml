[tools]
node = "24.14.0"
pnpm = "10.33.0"
python = "3.9.23"
"npm:typescript" = "4.8.4"
"npm:turbo" = "1.6.2"
"npm:cz-conventional-changelog" = "latest"
"npm:validate-commit-msg" = "latest"
"npm:@scamden/docker-name-generator" = "latest"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node", "python", "ruby"]
trusted_config_paths = ["/Users/scamden/.codex/worktrees"]

[tasks."agent:skills"]
description = "Install agent skills for Codex, Claude Code, and Cursor"
run = """
MATT_POCOCK_SKILLS_REF="6eeb81b5fcfeeb5bd531dd47ab2f9f2bbea27461"
MATT_POCOCK_SKILLS_DIR="$HOME/.cache/mise/mattpocock-skills"
if [ ! -d "$MATT_POCOCK_SKILLS_DIR/.git" ]; then
  git clone --filter=blob:none https://github.com/mattpocock/skills.git "$MATT_POCOCK_SKILLS_DIR"
fi
git -C "$MATT_POCOCK_SKILLS_DIR" fetch --depth=1 origin "$MATT_POCOCK_SKILLS_REF"
git -C "$MATT_POCOCK_SKILLS_DIR" checkout --detach "$MATT_POCOCK_SKILLS_REF"
npx --yes skills@latest add "$MATT_POCOCK_SKILLS_DIR" -g -a codex -a claude-code -a cursor --skill '*' -y

CAVEMAN_SKILLS_REF="25d22f864ad68cc447a4cb93aefde918aa4aec9f"
CAVEMAN_SKILLS_DIR="$HOME/.cache/mise/juliusbrussee-caveman"
if [ ! -d "$CAVEMAN_SKILLS_DIR/.git" ]; then
  git clone --filter=blob:none https://github.com/JuliusBrussee/caveman.git "$CAVEMAN_SKILLS_DIR"
fi
git -C "$CAVEMAN_SKILLS_DIR" fetch --depth=1 origin "$CAVEMAN_SKILLS_REF"
git -C "$CAVEMAN_SKILLS_DIR" checkout --detach "$CAVEMAN_SKILLS_REF"
npx --yes skills@latest add "$CAVEMAN_SKILLS_DIR" -g -a codex -a claude-code -a cursor --skill caveman -y

PONYTAIL_SKILLS_REF="64adbf9544581e57053a8d84a94e7e4471d40d95"
PONYTAIL_SKILLS_DIR="$HOME/.cache/mise/dietrichgebert-ponytail"
if [ ! -d "$PONYTAIL_SKILLS_DIR/.git" ]; then
  git clone --filter=blob:none https://github.com/DietrichGebert/ponytail.git "$PONYTAIL_SKILLS_DIR"
fi
git -C "$PONYTAIL_SKILLS_DIR" fetch --depth=1 origin "$PONYTAIL_SKILLS_REF"
git -C "$PONYTAIL_SKILLS_DIR" checkout --detach "$PONYTAIL_SKILLS_REF"
npx --yes skills@latest add "$PONYTAIL_SKILLS_DIR" -g -a codex -a claude-code -a cursor --skill '*' -y

if command -v codex >/dev/null 2>&1; then
  codex plugin marketplace add DietrichGebert/ponytail >/dev/null
  codex plugin marketplace upgrade ponytail >/dev/null
  codex plugin add ponytail@ponytail >/dev/null
fi

if command -v claude >/dev/null 2>&1; then
  claude plugin marketplace add DietrichGebert/ponytail >/dev/null
  claude plugin install ponytail@ponytail --scope user >/dev/null
  claude plugin update ponytail@ponytail --scope user >/dev/null
fi

npx --yes skills@latest add git@github.com:scamden/personal-agent-work.git -g -a codex -a claude-code -a cursor --skill '*' -y
"""

[hooks]
postinstall = { task = "agent:skills" }
